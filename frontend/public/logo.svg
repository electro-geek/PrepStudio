<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="500" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="barGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect width="100" height="100" rx="22" fill="url(#bg)" opacity="0.3"
        style="mix-blend-mode:overlay"/>
  <rect x="0.5" y="0.5" width="99" height="99" rx="21.5"
        fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- P letterform (outer + inner cutout via evenodd) -->
  <path
    fill-rule="evenodd"
    fill="white"
    filter="url(#glow)"
    d="
      M 14 14
      L 14 86
      L 26 86
      L 26 50
      Q 66 50 66 32
      Q 66 14 26 14
      Z
      M 26 22
      Q 58 22 58 32
      Q 58 42 26 42
      Z
    "
  />

  <!-- Audio waveform bars (voice / interview symbol) -->
  <!-- Bar 1 — short -->
  <rect x="72" y="26" width="6" height="12" rx="3" fill="white" fill-opacity="0.45"/>
  <!-- Bar 2 — medium -->
  <rect x="80" y="22" width="6" height="20" rx="3" fill="white" fill-opacity="0.7"/>
  <!-- Bar 3 — tall -->
  <rect x="88" y="18" width="6" height="28" rx="3" fill="white" fill-opacity="1"/>
</svg>
