<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" shape-rendering="crispEdges">
  <!-- Industrial label tile — paper substrate stays legible on any tab colour -->
  <rect width="72" height="72" fill="#F4F4F0"/>
  <rect x="3" y="3" width="66" height="66" fill="none" stroke="#0A0A0A" stroke-width="4"/>
  <!-- P stem -->
  <rect x="15" y="15" width="9" height="42" fill="#0A0A0A"/>
  <!-- Top crossbar -->
  <rect x="15" y="15" width="32" height="9" fill="#0A0A0A"/>
  <!-- Mid connector (base of P bowl) -->
  <rect x="15" y="33" width="21" height="9" fill="#0A0A0A"/>
  <!-- Telemetry bars — hazard red + carbon -->
  <rect x="39" y="15" width="9" height="27" fill="#E61919"/>
  <rect x="50" y="22" width="9" height="20" fill="#0A0A0A"/>
</svg>
