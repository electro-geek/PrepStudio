[alembic]
# Path to the alembic directory (relative to this file's location)
script_location = alembic

# Migration file naming: YYYYMMDD_<rev>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Add the backend/ directory to sys.path so "from app.xxx import ..." works
prepend_sys_path = .

# Timestamps in migration files use UTC
timezone = UTC

# The database URL is NOT set here — env.py reads it from app settings so we
# never hardcode credentials in a file that might end up in source control.
# To override from the CLI: alembic -x db_url=postgresql+asyncpg://... upgrade head

# ── Logging ─────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
